name: Publish

# Publishes only from a published GitHub Release (which points at a tag/commit
# on main). Combined with branch protection requiring CI to pass before
# merging to main, this guarantees CI has succeeded before publish runs.
# workflow_dispatch is available for manual/emergency publishes.
on:
  release:
    types: [published]
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PKG_NAME: '@guzelbaspinar/cassql'
    permissions:
      contents: read
      id-token: write # required for npm OIDC trusted publishing; no NPM_TOKEN secret
    concurrency:
      group: npm-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6

      # Do not pass registry-url to setup-node: it writes _authToken=${NODE_AUTH_TOKEN},
      # which prevents npm from using the Trusted Publisher OIDC exchange (E401/E404).
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.14.0"
          cache: "npm"

      - name: Prepare npm for Trusted Publishing
        run: |
          npm install -g npm@11.15.0
          npm --version
          npm config set registry https://registry.npmjs.org
          if [ -n "${NPM_CONFIG_USERCONFIG:-}" ] && [ -f "$NPM_CONFIG_USERCONFIG" ]; then
            sed -i '/:_authToken=/d' "$NPM_CONFIG_USERCONFIG" || true
          fi
          unset NODE_AUTH_TOKEN

      - name: Install dependencies
        run: npm ci

      - name: Verify package.json version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag ($TAG_VERSION) does not match package.json version ($PKG_VERSION)."
            exit 1
          fi

      - name: Skip if this version is already released on npm
        id: npm_version
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          PKG_NAME="$(node -p "require('./package.json').name")"
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"
          echo "name=$PKG_NAME" >> "$GITHUB_OUTPUT"
          if npm view "${PKG_NAME}@${PKG_VERSION}" version 2>/dev/null | grep -qx "$PKG_VERSION"; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "Version ${PKG_VERSION} is already public on npm; skipping publish."
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
            echo "Version ${PKG_VERSION} is not public yet; will run npm support diagnostics (stage + direct)."
          fi

      # Temporary: npm support ticket diagnostics (revert after reply sent).
      - name: Diagnostics for npm support
        if: steps.npm_version.outputs.already_published != 'true'
        run: |
          {
            echo "=== node -v ==="; node -v
            echo "=== npm -v ==="; npm -v
            echo "=== npm config get registry ==="; npm config get registry
            echo "=== npm config list -l ==="; npm config list -l
            echo "=== npm ping ==="; npm ping --registry=https://registry.npmjs.org
            echo "=== ls -la ==="; ls -la
            echo "=== .npmrc ==="; test -f .npmrc && cat .npmrc || echo "no repo .npmrc"
            echo "=== env grep ==="; env | sort | egrep -i 'NPM|NODE_AUTH_TOKEN|TOKEN|REGISTRY' || true
          } | tee diagnostics.log

      - name: Stage publish (diagnostic)
        id: stage_publish
        if: steps.npm_version.outputs.already_published != 'true'
        continue-on-error: true
        run: |
          set -o pipefail
          npm stage publish --access public --loglevel silly 2>&1 | tee stage-publish.log
          exit ${PIPESTATUS[0]}

      - name: Copy npm debug logs to workspace
        if: steps.npm_version.outputs.already_published != 'true'
        run: |
          mkdir -p npm-debug-logs
          cp -v "$HOME"/.npm/_logs/*.log npm-debug-logs/ 2>/dev/null || echo "No debug logs found in $HOME/.npm/_logs/"
          ls -la npm-debug-logs || true

      - name: Direct publish comparison (diagnostic)
        id: direct_publish
        if: steps.npm_version.outputs.already_published != 'true'
        continue-on-error: true
        run: |
          set -o pipefail
          npm publish --access public --provenance --loglevel silly 2>&1 | tee direct-publish.log
          exit ${PIPESTATUS[0]}

      - name: Copy npm debug logs to workspace (after direct publish)
        if: steps.npm_version.outputs.already_published != 'true'
        run: |
          cp -v "$HOME"/.npm/_logs/*.log npm-debug-logs/ 2>/dev/null || echo "No additional debug logs found."
          ls -la npm-debug-logs || true

      - name: Upload npm support diagnostic bundle
        if: steps.npm_version.outputs.already_published != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: npm-support-bundle-${{ github.run_id }}
          path: |
            diagnostics.log
            stage-publish.log
            direct-publish.log
            npm-debug-logs/
          if-no-files-found: warn

      - name: npm support diagnostic summary
        if: steps.npm_version.outputs.already_published != 'true'
        run: |
          {
            echo "## npm support diagnostics"
            echo ""
            echo "| Step | Result |"
            echo "|------|--------|"
            echo "| stage publish | ${{ steps.stage_publish.outcome }} |"
            echo "| direct publish | ${{ steps.direct_publish.outcome }} |"
            echo ""
            echo "Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Staged release reminder
        if: steps.npm_version.outputs.already_published != 'true' && steps.stage_publish.outcome == 'success'
        run: |
          PKG_VERSION="${{ steps.npm_version.outputs.version }}"
          PKG_NAME="${{ steps.npm_version.outputs.name }}"
          echo "Staged ${PKG_NAME}@${PKG_VERSION}. Approve on https://www.npmjs.com/package/${PKG_NAME} or run locally: npm stage approve (2FA)."
          npm stage list 2>/dev/null || true

      - name: Published to npm (direct OIDC)
        if: steps.npm_version.outputs.already_published != 'true' && steps.direct_publish.outcome == 'success'
        run: |
          PKG_VERSION="${{ steps.npm_version.outputs.version }}"
          PKG_NAME="${{ steps.npm_version.outputs.name }}"
          echo "Published ${PKG_NAME}@${PKG_VERSION} to https://www.npmjs.com/package/${PKG_NAME}"
